CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_POINTING=y

# Bumped so the EC11 driver can register GPIOTE event handlers for encoder
# A/B pins. Default of 1 is consumed by the kscan matrix, leaving the
# encoder driver unable to register interrupts (silent failure: rotation
# produces no events while the build looks correct).
CONFIG_NRFX_GPIOTE_NUM_OF_EVT_HANDLERS=15

# DIAGNOSTIC: disable ZMK idle/sleep. If ] spam stops with this off, the
# trigger is ZMK's idle-mode peripheral re-config (likely NFCT re-arming
# despite the UICR write). If it persists, the cause is physical (socket
# contact / EMI / trace defect). Revert this once root cause is known.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=86400000

# Disable ZMK deep-sleep. When idle, the SoC otherwise re-configures NFC as a
# wake source, which can re-assert NFC ownership of P0.09/P0.10 and break the
# kscan column on those pins (intermittent ] spam, top-row chatter). Disabling
# sleep costs battery life but is fine while USB-powered for diagnostics.
CONFIG_ZMK_SLEEP=n
